# Base de datos local para desarrollo: PostgreSQL con la extensión pgvector ya instalada.
# Arrancar:  docker compose up -d
# Parar:     docker compose down        (los datos se conservan en el volumen)
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
    environment:
      POSTGRES_DB: ragpeat
      POSTGRES_USER: ragpeat
      POSTGRES_PASSWORD: ragpeat   # solo para tu ordenador; en producción irá en una variable de entorno
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

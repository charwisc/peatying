# Lo que corre en el servidor EC2: la app y Caddy delante.
# Caddy recibe las visitas (puertos 80/443), pone el HTTPS y le pasa las peticiones a la app.
services:
  app:
    image: ${REGISTRY}/rag-peat:${APP_TAG:-latest}   # REGISTRY y APP_TAG: los escribe deploy.sh en .env
    restart: unless-stopped            # si se cae o se reinicia el servidor, vuelve a arrancar sola
    env_file: .env                     # DB_URL, DB_PASSWORD y las claves (lo genera deploy.sh desde Parameter Store)
    environment:
      CHAT_TRUST_PROXY: "true"         # = chat.trust-proxy: estamos detrás de Caddy, la IP real llega en X-Forwarded-For
    # Si alguien lograra colarse en la app: no puede cambiar nada del contenedor (solo /tmp, en memoria, y data/),
    # no tiene ningún permiso especial de Linux y no puede ganar más (setuid).
    read_only: true
    tmpfs:
      - /tmp                           # subidas de documentos a medio procesar y archivos de trabajo de Tomcat
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data               # artículos descargados (solo para los comandos download/index)
      - ./certs:/app/certs:ro          # certificados de RDS para comprobar la base de datos (los baja deploy.sh)
    logging:
      driver: awslogs                  # los logs van a CloudWatch, no se pierden si se borra el contenedor
      options:
        awslogs-region: eu-west-1
        awslogs-group: /ragpeat/app
        awslogs-create-group: "true"

  caddy:
    # @sha256: la imagen exacta, no "la que haya hoy con esa etiqueta". Dependabot propone las nuevas.
    image: caddy:2.11.6@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # aquí guarda Caddy los certificados HTTPS: no hay que perderlos
      - caddy_config:/config
    depends_on:
      - app
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-1
        awslogs-group: /ragpeat/caddy
        awslogs-create-group: "true"

volumes:
  caddy_data:
  caddy_config:
